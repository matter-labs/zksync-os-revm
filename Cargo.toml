[package]
name = "zksync-os-revm"
authors = ["The Matter Labs Team <hello@matterlabs.dev>"]
homepage = "https://zksync.io/"
repository = "https://github.com/matter-labs/zksync-os-revm"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
keywords = ["blockchain", "zksync"]
categories = ["cryptography"]

[dependencies]
revm = { version = "=42.0.1", default-features = false, features = ["std", "serde", "tracer", "optional_balance_check"] }
auto_impl = "1.3.0"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[features]
default = ["c-libs"]
# The C libraries that revm links for the secp256k1, BLS12-381 and KZG
# precompiles. `portable` selects the blst and c-kzg builds that hold to the
# base instruction set. A consumer that leans towards no-std turns the bundle
# off and gets the pure Rust fallbacks.
c-libs = ["revm/secp256k1", "revm/blst", "revm/c-kzg", "revm/portable"]
